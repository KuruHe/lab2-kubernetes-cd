apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-cd-web
  labels:
    app: lab2-cd-web

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: lab2-cd-web

  template:
    metadata:
      labels:
        app: lab2-cd-web

    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5