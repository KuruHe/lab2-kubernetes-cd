name: Continuous Deployment to Kubernetes

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check kubectl
        run: kubectl version --client

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/lab2-cd-web --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get deployment lab2-cd-web
          kubectl get pods -l app=lab2-cd-web
          kubectl get service lab2-cd-service